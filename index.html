<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Runner 2D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span id="hud-score">Score: 0</span>
        <span id="hud-best">Best: 0</span>
        <span id="hud-speed">Speed: 0</span>
        <button id="settings-toggle" type="button" aria-expanded="false">Settings</button>
      </header>
      <main id="stage">
        <canvas id="game" width="600" height="200" aria-label="Endless runner game"></canvas>
        <aside id="settings-panel" hidden></aside>
      </main>
      <section id="scoreboard" aria-label="Top local scores"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
